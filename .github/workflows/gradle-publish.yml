name: Gradle Package (Development)

on:
    workflow_dispatch:
        inputs:
            run-build-scan:
                description: 'Run with public build scan (adds --scan)'
                required: true
                type: boolean
                default: false
            publish-artifacts:
                description: 'Upload to Modrinth & API? (Uncheck for a dry run)'
                type: boolean
                default: true
            use-modrinth-fallback:
                description: 'Fall back to Modrinth for changelog range when push payload is unavailable'
                required: false
                type: boolean
                default: true
            runner:
                description: 'The runner to use for the build job.'
                required: false
                type: string
                default: 'ix'
            refresh-gradle-cache:
                description: 'Write a new Gradle User Home cache entry instead of using read-only ix caching.'
                required: false
                type: boolean
                default: false
    push:
        branches:
            - 'main'
            - '2.0'
            - 'dev'
            - 'release'
            - 'release/**'
        paths:
            - 'bukkit/**'
            - 'common/**'
            - '**.java'
            - '**.kt'
            - '**.kts'
            - '**.toml'
jobs:
    call-build-workflow:
        uses: ./.github/workflows/build-and-publish.yml
        with:
            runner: ${{ github.event.inputs.runner || 'ix' }}
            is-release-build: false
            publish-artifacts: ${{ github.event.inputs.publish-artifacts == 'true' || github.event.inputs.publish-artifacts == null }}
            use-modrinth-fallback: ${{ github.event.inputs.use-modrinth-fallback == 'true' || github.event.inputs.use-modrinth-fallback == null }}
            run-build-scan: ${{ github.event.inputs.run-build-scan == 'true' }}
            refresh-gradle-cache: ${{ github.event.inputs.refresh-gradle-cache == 'true' }}
        secrets: inherit
